name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Swift 6.4 needs Xcode 27; this runner is currently a public preview.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record source identity
        id: source
        uses: ./.github/actions/source-receipt
      - name: Check cache helper
        run: python3 -B Scripts/ci/test-swift-build-cache.py
      - name: Identify exact build inputs
        id: build-inputs
        shell: bash
        run: python3 -B Scripts/ci/swift-build-cache.py prepare --identity "$RUNNER_TEMP/chio-swift-cache.json" --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        with:
          path: .build/ci-cache
          key: ${{ steps.build-inputs.outputs.key }}
      - name: Validate cached build inputs
        shell: bash
        run: python3 -B Scripts/ci/swift-build-cache.py restore --identity "$RUNNER_TEMP/chio-swift-cache.json" --hit '${{ steps.build-cache.outputs.cache-hit }}'
      - name: Test, build release, and exercise the terminal
        shell: bash
        run: python3 -B Scripts/ci/swift-build-cache.py verify --identity "$RUNNER_TEMP/chio-swift-cache.json" 2>&1 | tee ci-verification.log
      - name: Record successful build inputs
        shell: bash
        run: python3 -B Scripts/ci/swift-build-cache.py record --identity "$RUNNER_TEMP/chio-swift-cache.json"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: .build/ci-cache
          key: ${{ steps.build-inputs.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-verification
          include-hidden-files: true
          path: |
            ci-verification.log
            .build/ci-results/*.txt
            .build/ci-results/*.xml
            .build/ci-results/appearance/**
            .build/ci-results/dot-matrix/**
            .build/ci-results/maps/**

  linux:
    runs-on: ubuntu-24.04
    container: docker.io/library/swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install terminal smoke prerequisite
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Record source identity
        id: source
        uses: ./.github/actions/source-receipt
      - name: Check cache helper
        run: python3 -B Scripts/ci/test-swift-build-cache.py
      - name: Identify exact build inputs
        id: build-inputs
        shell: bash
        run: >-
          python3 -B Scripts/ci/swift-build-cache.py prepare
          --identity "$RUNNER_TEMP/chio-swift-cache.json"
          --repository "$GITHUB_REPOSITORY"
          --image docker.io/library/swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
          >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        with:
          path: .build/ci-cache
          key: ${{ steps.build-inputs.outputs.key }}
      - name: Validate cached build inputs
        shell: bash
        run: python3 -B Scripts/ci/swift-build-cache.py restore --identity "$RUNNER_TEMP/chio-swift-cache.json" --hit '${{ steps.build-cache.outputs.cache-hit }}'
      - name: Test, build release, and exercise the terminal
        shell: bash
        run: python3 -B Scripts/ci/swift-build-cache.py verify --identity "$RUNNER_TEMP/chio-swift-cache.json" 2>&1 | tee ci-verification.log
      - name: Record successful build inputs
        shell: bash
        run: python3 -B Scripts/ci/swift-build-cache.py record --identity "$RUNNER_TEMP/chio-swift-cache.json"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: .build/ci-cache
          key: ${{ steps.build-inputs.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-verification
          include-hidden-files: true
          path: |
            ci-verification.log
            .build/ci-results/*.txt
            .build/ci-results/*.xml
            .build/ci-results/appearance/**
            .build/ci-results/dot-matrix/**
            .build/ci-results/maps/**
