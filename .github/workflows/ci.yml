name: Appearance timing diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appearance-diagnostic-${{ github.ref }}
  cancel-in-progress: true

# Investigation branch only. This workflow is not a replacement for Chio's gate.
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: docker.io/library/swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Compare complete appearance workflow in debug and release
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git -c safe.directory="$PWD" rev-parse HEAD
          mkdir -p .build/ci-results
          swift --version > .build/ci-results/toolchain.txt
          uname -a >> .build/ci-results/toolchain.txt
          lscpu >> .build/ci-results/toolchain.txt
          git -c safe.directory="$PWD" diff 0c786c5b12edc33edd262395f64ed2912ed32db9 "$GITHUB_SHA" -- Package.swift Tests Examples > .build/ci-results/instrumentation.patch
          result=0
          for configuration in debug release; do
            set +e
            SWIFTTUI_PROFILE="frames;jsonl=$PWD/.build/ci-results/profile-$configuration.jsonl" \
              swift test -c "$configuration" --jobs 2 --no-parallel --force-resolved-versions \
              --filter AppearanceExampleTests \
              --xunit-output ".build/ci-results/$configuration.xml" \
              2>&1 | tee ".build/ci-results/$configuration.log"
            test_status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$test_status" > ".build/ci-results/$configuration.exit"
            if [[ "$test_status" != 0 ]]; then result=1; fi
          done
          git -c safe.directory="$PWD" diff --exit-code -- Package.swift Package.resolved Tests Examples
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: appearance-timing-diagnostic
          include-hidden-files: true
          path: .build/ci-results/**
